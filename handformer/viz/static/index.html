<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>handformer visualizer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">handformer <span class="brand-sub">visualizer</span></div>
    <form id="expr-form" class="prompt">
      <input id="expr-input" type="text" value="2+3*(4-1)" spellcheck="false" autocomplete="off" aria-label="Expression">
      <button type="submit" class="primary">Run</button>
    </form>
    <div class="controls">
      <button id="btn-first" title="First step (Home)">⏮</button>
      <button id="btn-back" title="Step back (←)">◀</button>
      <button id="btn-step" title="Step forward (→)">Step ▶</button>
      <button id="btn-play" title="Play (space)">Play</button>
      <label title="Show only the circuits that are active at this step"><input id="focus" type="checkbox" checked> focus active circuit</label>
      <label>speed
        <select id="speed">
          <option value="900">slow</option>
          <option value="350" selected>normal</option>
          <option value="80">fast</option>
        </select>
      </label>
    </div>
    <div id="status" class="status" role="status"></div>
  </header>

  <section class="sequence">
    <div class="sequence-head">
      <span class="label">Sequence</span>
      <span id="step-label" class="muted"></span>
      <span class="spacer"></span>
      <span class="legend">
        <span class="lg ph-prompt">prompt</span><span class="lg ph-open">open [</span>
        <span class="lg ph-copy">copy redex</span><span class="lg ph-add">add</span>
        <span class="lg ph-sub">sub</span><span class="lg ph-mul">mul</span>
        <span class="lg ph-rewrite">rewrite</span>
      </span>
    </div>
    <div id="tokens" class="token-strip"></div>
    <input id="scrubber" type="range" min="0" max="0" value="0" aria-label="Step">
  </section>

  <main class="grid">
    <section class="panel">
      <div class="panel-title">Step</div>
      <div id="explain" class="explain"></div>
      <div class="panel-title">Next byte <span class="muted small">top logits</span></div>
      <div id="logits" class="logits"></div>
      <div class="panel-title">Pointers <span class="muted small">shared dims at this step</span></div>
      <div id="marks" class="marks"></div>
      <div class="panel-title">Selected head</div>
      <div id="head-detail" class="detail muted">click a head</div>
    </section>

    <section class="panel">
      <div class="panel-title">Attention heads
        <input id="head-filter" class="filter" type="text" placeholder="filter (e.g. mul, latest)" spellcheck="false">
      </div>
      <div id="heads" class="scroll"></div>
    </section>

    <section class="panel">
      <div class="panel-title">Residual stream
        <input id="dim-filter" class="filter" type="text" placeholder="filter dims" spellcheck="false">
        <label class="small"><input id="show-zero" type="checkbox"> zeros</label>
      </div>
      <div id="dims" class="scroll"></div>
    </section>
  </main>

  <section class="panel wide">
    <div class="panel-title">Heatmaps
      <nav class="tabs" role="tablist">
        <button role="tab" data-map="residual" class="active">Residual stream</button>
        <button role="tab" data-map="step">This step · dims × layers</button>
        <button role="tab" data-map="attention">Attention · selected head</button>
        <button role="tab" data-map="mlp">MLP activations</button>
      </nav>
      <span id="map-controls" class="map-controls">
        <label data-for="residual">after <select id="snapshot"></select></label>
        <label data-for="mlp">layer <select id="mlp-layer"></select></label>
        <label data-for="attention">gamma <input id="gamma" type="range" min="0.2" max="1.5" step="0.05" value="0.5"></label>
      </span>
    </div>
    <div id="map-caption" class="muted small"></div>
    <div class="map-wrap"><canvas id="map"></canvas></div>
  </section>

  <section class="panel wide">
    <div class="panel-title">Active MLP units <span class="muted small">ReLU(read) → write, at this step</span>
      <input id="unit-filter" class="filter" type="text" placeholder="filter (e.g. carry, D3)" spellcheck="false">
    </div>
    <div id="units" class="scroll units"></div>
  </section>

  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
