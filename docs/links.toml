# Named source locations for the docs. Reference one in Markdown as [](src:KEY);
# `python tools/doclinks.py` turns it into a link to the current line, and keeps it current.
# `match` is text that must occur on exactly one line of `file`; no line numbers are stored.

[repo]
url = "https://github.com/lhubbard011/opus-handformer-calculator"
ref = "main"

